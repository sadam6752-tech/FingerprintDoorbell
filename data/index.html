<!DOCTYPE html>
<html>
<head>
<title>FingerprintDoorbell</title>
<meta name="viewport" content="width=device-width, initial-scale=1" charset="utf-8">
<link rel="icon" href="data:,">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#1a1a2e;color:#e0e0e0;line-height:1.5}
a{color:#FF8C00;text-decoration:none}
.nav{position:sticky;top:0;z-index:10;background:#16213e;display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid #2a2a4a;gap:12px}
.nav .brand{font-weight:700;font-size:1.1em;flex:1}
.nav a{font-size:.9em;padding:6px 12px;border-radius:6px;color:#ccc}
.nav a.active{background:#FF8C00;color:#fff}
.wrap{max-width:540px;margin:0 auto;padding:16px}
.log{background:#0d1117;border-left:3px solid #FF8C00;padding:12px;margin-bottom:16px;font-family:'Courier New',monospace;font-size:.8em;border-radius:6px;min-height:50px;line-height:1.6}
.card{background:#16213e;border:1px solid #2a2a4a;border-radius:10px;padding:20px;margin-bottom:16px}
.card h2{font-size:1.05em;margin-bottom:14px;color:#FF8C00;padding-bottom:8px;border-bottom:1px solid #2a2a4a}
label{display:block;font-size:.85em;margin-bottom:5px;color:#aaa;margin-top:10px}
label:first-child{margin-top:0}
input[type=text],select{display:block;width:100%%;padding:10px 12px;border:1px solid #2a2a4a;border-radius:6px;background:#0d1117;color:#e0e0e0;font-size:.9em;margin-bottom:4px}
select{height:160px}
input:focus,select:focus{outline:none;border-color:#FF8C00;box-shadow:0 0 0 2px rgba(255,140,0,0.2)}
small{display:block;color:#777;font-size:.78em;margin-bottom:12px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{display:inline-block;padding:9px 18px;border:none;border-radius:6px;font-size:.85em;font-weight:500;cursor:pointer;color:#fff;text-decoration:none}
.btn-green{background:#2ea043}.btn-green:hover{background:#3cba54}
.btn-red{background:#c0392b}.btn-red:hover{background:#e74c3c}
.btn-blue{background:#2980b9}.btn-blue:hover{background:#3498db}
.footer{text-align:center;font-size:.75em;color:#555;padding:24px 12px}
</style>
</head>
<body>
<script>
if(!!window.EventSource){
var source=new EventSource('/events');
source.addEventListener('message',function(e){document.getElementById('logMessages').innerHTML=e.data;},false);
source.addEventListener('fingerlist',function(e){document.getElementById('selectedFingerprint').innerHTML=e.data;},false);
}
function askForNewName(e){
var list=document.getElementById("selectedFingerprint");
var strOldName=list.options[list.selectedIndex].text;
strOldName=strOldName.substr(strOldName.indexOf('-')+2);
var newname=prompt('New Name?',strOldName);
if(newname===null) document.getElementById('renameNewName').value=strOldName;
else document.getElementById('renameNewName').value=newname;
}
</script>

<nav class="nav">
<span class="brand">%HOSTNAME%</span>
<a class="active" href="/">Fingerprints</a>
<a href="/settings">Settings</a>
</nav>

<div class="wrap">
<div class="log" id="logMessages">%LOGMESSAGES%</div>

<form action="/editFingerprints">
<div class="card">
<h2>Manage Fingerprints</h2>
<label for="selectedFingerprint">Fingerprints in DB</label>
<select id="selectedFingerprint" name="selectedFingerprint" size="8">%FINGERLIST%</select>
<input type="hidden" id="renameNewName" name="renameNewName">
<div class="btns">
<button name="btnRename" class="btn btn-blue" onclick="askForNewName(event)">Rename</button>
<button name="btnDelete" class="btn btn-red">Delete</button>
</div>
</div>
</form>

<form action="/enroll">
<div class="card">
<h2>Add / Replace Fingerprint</h2>
<label for="newFingerprintId">Memory slot (1-200)</label>
<input id="newFingerprintId" name="newFingerprintId" type="text" placeholder="1-200" required>
<small>The slot number is used as ID in MQTT messages.</small>
<label for="newFingerprintName">Name</label>
<input id="newFingerprintName" name="newFingerprintName" type="text" placeholder="(optional)">
<small>Human-readable name, also published via MQTT.</small>
<div class="btns">
<button name="startEnrollment" class="btn btn-green">Start enrollment</button>
</div>
</div>
</form>
</div>

<div class="footer">FingerprintDoorbell v%VERSIONINFO%</div>
</body>
</html>
